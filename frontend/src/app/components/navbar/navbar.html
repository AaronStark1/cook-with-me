<header class="site-header">
  <div class="site-header__bar wrap">

    <a class="wordmark" routerLink="/" aria-label="Cook With Me — home">
      <span class="wordmark__a">Cook</span><span class="wordmark__b">With Me</span>
    </a>

    <button
      #menuButton
      type="button"
      class="site-header__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      (click)="toggleMenu()"
    >
      <span aria-hidden="true" class="site-header__toggle-bars"></span>
      {{ menuOpen() ? 'Close' : 'Menu' }}
    </button>

    <nav id="site-nav" class="site-nav" [class.is-open]="menuOpen()" aria-label="Primary">

      <ul class="site-nav__list">
        <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a></li>
        <li><a routerLink="/all-recipes" routerLinkActive="is-active" ariaCurrentWhenActive="page">Recipes</a></li>
        <li><a routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page">About</a></li>
        <li><a routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page">Contact</a></li>
      </ul>

      <div class="account">
        @if (auth.isLoggedIn()) {

          <button
            #accountButton
            type="button"
            class="account__toggle"
            [attr.aria-expanded]="accountOpen()"
            aria-controls="account-menu"
            (click)="toggleAccount()"
          >
            <i class="bi bi-person-fill" aria-hidden="true"></i>
            <span class="account__name">{{ auth.user()?.username || 'Account' }}</span>
            <i class="bi bi-chevron-down account__chevron" aria-hidden="true"></i>
          </button>

          <div id="account-menu" class="account__menu" [class.is-open]="accountOpen()">
            <p class="account__who label">Signed in as {{ auth.user()?.username || 'you' }}</p>
            <ul>
              @if (auth.isAdmin()) {
                <li><a routerLink="/admin">Admin panel</a></li>
              }
              <li><a routerLink="/profile">Profile</a></li>
              <li><a routerLink="/saved-recipes">My collection</a></li>
              <li><button type="button" (click)="logout()">Log out</button></li>
            </ul>
          </div>

        } @else {

          <div class="account__guest">
            <a class="btn-cwm btn-cwm--ghost btn-cwm--sm" routerLink="/login">Log in</a>
            <a class="btn-cwm btn-cwm--sm" routerLink="/register">Join</a>
          </div>

        }
      </div>

    </nav>

  </div>
</header>
