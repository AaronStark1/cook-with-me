<div class="admin">

  <!-- SIDEBAR (becomes a top bar with a menu toggle below 768px) -->
  <aside class="admin__side">

    <div class="admin__brand">
      <a class="wordmark" routerLink="/admin" aria-label="Cook With Me — admin dashboard">
        <span class="wordmark__a">Cook</span><span class="wordmark__b">With Me</span>
      </a>

      <span class="tag admin__badge">Admin</span>

      <button
        #navToggle
        type="button"
        class="admin__toggle"
        [attr.aria-expanded]="navOpen()"
        aria-controls="admin-nav"
        (click)="toggleNav()"
      >
        {{ navOpen() ? 'Close' : 'Menu' }}
      </button>
    </div>

    <nav id="admin-nav" class="admin__nav" [class.is-open]="navOpen()" aria-label="Admin">
      <p class="admin__who label">Signed in as {{ auth.user()?.username || 'admin' }}</p>

      <ul #navList>
        <li>
          <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
            <i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/admin/recipelist" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            <i class="bi bi-egg-fried" aria-hidden="true"></i> Recipes
          </a>
        </li>
        <li>
          <a routerLink="/admin/userslist" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            <i class="bi bi-people" aria-hidden="true"></i> Users
          </a>
        </li>
        <li>
          <a routerLink="/admin/downloadlist" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            <i class="bi bi-download" aria-hidden="true"></i> Downloads
          </a>
        </li>
        <li>
          <a routerLink="/admin/requestlist" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            <i class="bi bi-inbox" aria-hidden="true"></i> Requests
          </a>
        </li>
      </ul>

      <ul class="admin__nav-foot">
        <li>
          <a routerLink="/">
            <i class="bi bi-house" aria-hidden="true"></i> View site
          </a>
        </li>
        <li>
          <button type="button" (click)="logout()">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout
          </button>
        </li>
      </ul>
    </nav>

  </aside>

  <!-- CONTENT (App already wraps the router outlet in <main id="main">) -->
  <div class="admin__content">
    <router-outlet></router-outlet>
  </div>

</div>
