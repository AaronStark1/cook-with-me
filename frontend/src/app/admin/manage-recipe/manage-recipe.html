<div class="container-fluid py-4">

  <!-- Dynamic Title -->
  <h2 class="fw-bold text-warning text-center mb-4">
    {{ recipeId ? 'Edit Recipe Details' : 'Add Recipe Details' }}
  </h2>

  <div class="card shadow rounded-4 border-0 p-4">

    <div class="row g-3">

      <!-- BASIC DETAILS -->

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.name"
          name="name"
          type="text"
          class="form-control"
          placeholder="Recipe Name"
        />
      </div>

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.cookTimeMinutes"
          name="cookTimeMinutes"
          type="number"
          class="form-control"
          placeholder="Cooking Time (minutes)"
        />
      </div>

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.prepTimeMinutes"
          name="prepTimeMinutes"
          type="number"
          class="form-control"
          placeholder="Preparation Time (minutes)"
        />
      </div>

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.servings"
          name="servings"
          type="number"
          class="form-control"
          placeholder="Servings"
        />
      </div>

      <div class="col-md-6">
        <select
          [(ngModel)]="recipeDetails.cuisine"
          name="cuisine"
          class="form-select"
        >
          <option value="" hidden>Select Cuisine</option>
          <option *ngFor="let item of cuisineArray" [value]="item">
            {{ item }}
          </option>
        </select>
      </div>

      <div class="col-md-6">
        <select
          [(ngModel)]="recipeDetails.difficulty"
          name="difficulty"
          class="form-select"
        >
          <option value="" hidden>Select Difficulty</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.image"
          name="image"
          type="text"
          class="form-control"
          placeholder="Recipe Image URL"
        />
      </div>

      <div class="col-md-6">
        <input
          [(ngModel)]="recipeDetails.caloriesPerServing"
          name="caloriesPerServing"
          type="number"
          class="form-control"
          placeholder="Calories Per Serving"
        />
      </div>

      <!-- INGREDIENTS SECTION -->

      <div class="col-12 mt-4">
        <label class="fw-semibold mb-2 text-warning">Ingredients</label>

        <div class="d-flex">
          <textarea
            #ingredients
            class="form-control"
            rows="3"
            placeholder="Add ingredient"
          ></textarea>

          <button
            (click)="addIngredients(ingredients)"
            class="btn btn-warning ms-2 px-3"
          >
            +
          </button>
        </div>

        <div class="mt-3">
          <div
            *ngFor="let item of ingredientsArray; let i = index"
            class="d-inline-block bg-light border rounded-pill px-3 py-1 m-1"
          >
            {{ item }}
            <button
              class="btn btn-sm text-danger ms-2"
              (click)="deleteIngredients(i)"
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- INSTRUCTIONS SECTION -->

      <div class="col-12 mt-4">
        <label class="fw-semibold mb-2 text-warning">
          Cooking Instructions
        </label>

        <div class="d-flex">
          <textarea
            #instructions
            class="form-control"
            rows="3"
            placeholder="Add cooking step"
          ></textarea>

          <button
            (click)="addInstructions(instructions)"
            class="btn btn-warning ms-2 px-3"
          >
            +
          </button>
        </div>

        <div class="mt-3">
          <div
            *ngFor="let item of instructionsArray; let i = index"
            class="d-inline-block bg-light border rounded-pill px-3 py-1 m-1"
          >
            {{ item }}
            <button
              class="btn btn-sm text-danger ms-2"
              (click)="deleteInstructions(i)"
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- MEAL TYPE SECTION -->

      <div class="col-12 mt-4">
        <label class="fw-semibold mb-2 text-warning">
          Meal Type
        </label>

        <div class="d-flex">
          <input
            #mealInput
            type="text"
            class="form-control"
            placeholder="Add Meal Type (Breakfast, Lunch, Dinner...)"
          />

          <button
            (click)="addMeal(mealInput)"
            class="btn btn-warning ms-2 px-3"
          >
            +
          </button>
        </div>

        <div class="mt-3">
          <div
            *ngFor="let item of mealTypeArray"
            class="d-inline-block bg-warning text-white rounded-pill px-3 py-1 m-1"
          >
            {{ item }}
            <button
              class="btn btn-sm text-white ms-2"
              (click)="removeMeal(item)"
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- ACTION BUTTON -->

      <div class="col-12 text-center mt-5">

        <button
          *ngIf="!recipeId"
          (click)="addRecipe()"
          class="btn btn-warning px-5 rounded-pill"
        >
          Add Recipe
        </button>

        <button
          *ngIf="recipeId"
          (click)="editRecipe()"
          class="btn btn-warning px-5 rounded-pill"
        >
          Update Recipe
        </button>

      </div>

    </div>

  </div>

</div>
