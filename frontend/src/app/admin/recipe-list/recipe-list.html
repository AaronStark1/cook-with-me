<div class="d-flex justify-content-between align-items-center mb-4">
  <button class="btn btn-success fw-semibold"
  routerLink="/admin/recipe/add"
  >
    Add Recipe
  </button>

  <input
    type="text"
    class="form-control w-25 rounded-pill px-4"
    placeholder="Search Recipe"
  />
</div>

<div class="card shadow-sm rounded-4">
  <table class="table align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Image</th>
        <th>Cuisine</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let recipe of recipes; index as i">
        <td>{{ i + 1 }}</td>
        <td class="fw-semibold">{{ recipe.name }}</td>
        <td>
          <img
            [src]="recipe.image"
            width="60"
            class="rounded"
          />
        </td>
        <td>{{ recipe.cuisine }}</td>
<td>
  <button
    class="btn btn-link text-primary"
    [routerLink]="['/admin/recipe/edit', recipe._id]"
  >
    <i class="bi bi-pencil-fill"></i>
  </button>

  <button
    class="btn btn-link text-danger"
    (click)="deleteRecipe(recipe._id)"
  >
    <i class="bi bi-trash-fill"></i>
  </button>
</td>

    </tbody>
  </table>
</div>
